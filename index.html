<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>isitai</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- All visible text comes from strings.js (data-i18n keys). -->
<a class="skip" href="#result" data-i18n="result.title"></a>

<header class="mast">
  <div class="wrap">
    <p class="wordmark"><span class="mark" aria-hidden="true"></span>isitai</p>
    <h1 data-i18n="head.tagline"></h1>
    <p class="lede" data-i18n="head.lede"></p>
  </div>
</header>

<main class="wrap">
  <noscript><p class="notice" >This demo needs JavaScript.</p></noscript>

  <section id="engine-down" class="notice alert" hidden aria-labelledby="engine-down-title">
    <h2 id="engine-down-title" data-i18n="engine.down.title"></h2>
    <p id="engine-down-body"></p>
  </section>

  <section class="caveat" aria-labelledby="caveat-title">
    <h2 id="caveat-title" data-i18n="caveat.title"></h2>
    <ul>
      <li data-i18n="caveat.nosignal"></li>
      <li data-i18n="caveat.strip"></li>
    </ul>
  </section>

  <section class="panel" aria-labelledby="input-title">
    <h2 id="input-title" data-i18n="input.title"></h2>
    <div class="inputs">
      <div id="drop" class="drop">
        <h3 data-i18n="input.file.title"></h3>
        <p><span data-i18n="input.file.hint"></span></p>
        <input id="file" class="visually-hidden" type="file">
        <label for="file" class="btn" data-i18n="input.file.button"></label>
        <p class="small" data-i18n="input.file.formats"></p>
      </div>
      <form id="text-form" class="textbox" novalidate>
        <h3 data-i18n="input.text.title"></h3>
        <label for="text" class="visually-hidden" data-i18n="input.text.label"></label>
        <textarea id="text" rows="5" spellcheck="false" data-i18n-placeholder="input.text.placeholder"></textarea>
        <div class="row">
          <button type="submit" class="btn" data-i18n="input.text.button"></button>
          <span id="text-msg" class="small" role="status"></span>
        </div>
      </form>
    </div>
    <p class="small privacy" data-i18n="privacy"></p>
  </section>

  <section id="result" class="report" tabindex="-1" aria-labelledby="result-title">
    <h2 id="result-title" data-i18n="result.title"></h2>
    <div id="result-body" aria-live="polite">
      <p class="muted" data-i18n="result.empty"></p>
    </div>
  </section>

  <section class="legend" aria-labelledby="legend-title">
    <h2 id="legend-title" data-i18n="legend.title"></h2>
    <ol id="legend-list" class="legend-list"></ol>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p><span class="wordmark small-mark">isitai</span> · <span data-i18n="foot.offline"></span></p>
  </div>
</footer>

<script src="strings.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
